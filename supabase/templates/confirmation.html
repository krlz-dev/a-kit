<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"></head>
<body style="margin:0;padding:0;background:#080c08;font-family:'Helvetica Neue',Arial,sans-serif">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#080c08;padding:40px 20px">
    <tr><td align="center">
      <table width="480" cellpadding="0" cellspacing="0" style="background:#101610;border:1px solid rgba(200,230,0,0.1);border-radius:12px;padding:40px 32px">
        <!-- Logo -->
        <tr><td align="center" style="padding-bottom:24px">
          <span style="font-size:24px;font-weight:700;color:#d8e4d8;letter-spacing:-0.5px">kit-a</span>
        </td></tr>
        <!-- Title -->
        <tr><td align="center" style="padding-bottom:16px">
          <h1 style="margin:0;font-size:20px;font-weight:600;color:#c8e600">Welcome to kit-a</h1>
        </td></tr>
        <!-- Body -->
        <tr><td style="padding-bottom:24px;font-size:14px;line-height:1.6;color:#7a8e7a;text-align:center">
          Confirm your email to start building architecture diagrams and project timelines in the cloud.
        </td></tr>
        <!-- Button -->
        <tr><td align="center" style="padding-bottom:32px">
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#c8e600;color:#080c08;font-size:14px;font-weight:600;text-decoration:none;padding:12px 32px;border-radius:8px">
            Confirm email
          </a>
        </td></tr>
        <!-- Footer -->
        <tr><td style="border-top:1px solid rgba(200,230,0,0.06);padding-top:20px;font-size:12px;color:#4a5c4a;text-align:center">
          Architecture diagrams &middot; Gantt charts &middot; Cloud storage<br>
          <a href="https://kit-a.com" style="color:#7a8e7a;text-decoration:none">kit-a.com</a>
        </td></tr>
      </table>
    </td></tr>
  </table>

</html>
